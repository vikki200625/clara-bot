name: clara

# Clara lives here: this workflow polls Telegram and replies using the NIM brain.
# Each run serves for MAX_RUNTIME_MS, then dispatches the next run,
# so the bot is online continuously. The cron is only a watchdog: if the chain
# ever breaks, the next scheduled run starts a fresh one.
#
# Needs repo secrets: TELEGRAM_BOT_TOKEN, NIM_KEY, MEM_SECRET (= wrangler TG_SECRET),
#   TG_API_ID, TG_API_HASH, TELEGRAM_SESSION (read-receipt listener; optional —
#   without it the ladder falls back to time-based nudges)
# Needs repo variables: MEM_URL, ALLOWED_CHAT_IDS, GREET_ON_START

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: clara-live
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/clara.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.status==\"in_progress\" or .status==\"queued\") | select(.id != ${GITHUB_RUN_ID})] | length")
          echo "other clara runs in flight: $others"
          if [ "$others" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  clara:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report egress IP
        run: 'echo "runner ip $(curl -s https://api.ipify.org)"'

      - name: Unit tests
        run: node --test

      - name: Read-receipt listener (supervised)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          MEM_URL: ${{ vars.MEM_URL }}
          MEM_SECRET: ${{ secrets.MEM_SECRET }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
        run: |
          if [ -z "$TELEGRAM_SESSION" ]; then
            echo "TELEGRAM_SESSION secret missing — read-receipts disabled, ladder falls back to time-based nudges"
            exit 0
          fi
          pip install --quiet telethon
          # Run listener in background but capture PID and output
          python listener.py > listener.log 2>&1 &
          LISTENER_PID=$!
          echo "listener PID: $LISTENER_PID"
          # Register cleanup trap
          trap "kill $LISTENER_PID 2>/dev/null; echo 'listener stopped'; cat listener.log" EXIT
          # Brief health check - wait a moment and verify it's still running
          sleep 3
          if ! kill -0 $LISTENER_PID 2>/dev/null; then
            echo "listener died on startup:"
            cat listener.log
            exit 1
          fi
          echo "listener healthy, continuing..."

      - name: Poll Telegram and reply
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NIM_KEY: ${{ secrets.NIM_KEY }}
          MEM_URL: ${{ vars.MEM_URL }}
          MEM_SECRET: ${{ secrets.MEM_SECRET }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
          GREET_ON_START: ${{ github.event_name == 'workflow_dispatch' && vars.GREET_ON_START || '' }}
          MAX_RUNTIME_MS: "1800000"
        run: node clara-poller.mjs

      - name: Chain the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clara.yml --repo "$GITHUB_REPOSITORY"
